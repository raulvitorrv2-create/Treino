<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Treinos</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2159f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232159f0'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#061744;--royal:#2159f0;--sky:#38bdf8;--ice:#eef4ff;--card:#fff;--ink:#0b1b4a;--mut:#6479a8;--line:#dbe6ff;--red:#e5484d;--sh:0 10px 28px rgba(33,89,240,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;background:var(--ice);color:var(--ink)}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.3px}
header{position:relative;overflow:hidden;color:#fff;padding:26px 20px 64px;background:radial-gradient(600px 240px at 90% -20%,rgba(56,189,248,.55),transparent 70%),linear-gradient(135deg,var(--navy) 0%,#0c2e8f 55%,var(--royal) 100%)}
header::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px);pointer-events:none}
header .top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;max-width:900px;margin:auto}
header h1{font-size:46px;line-height:1;font-weight:700}
header p{margin:6px 0 0;color:#b9ccff;font-size:16px}
nav{position:relative;z-index:2;display:flex;gap:4px;max-width:900px;margin:-26px auto 0;padding:5px;background:#fff;border-radius:999px;box-shadow:var(--sh);width:calc(100% - 40px)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 17px Barlow;padding:12px 8px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--royal),#4f86ff);box-shadow:0 6px 14px rgba(33,89,240,.35)}
main{max-width:900px;margin:auto;padding:22px 20px 40px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--sh);border:1px solid #e6eeff}
.card h2{font-size:28px;color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--ice);color:var(--ink);min-width:0}
input::placeholder{color:#93a6cf}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--royal);box-shadow:0 0 0 4px rgba(33,89,240,.15)}
.btn{background:linear-gradient(135deg,var(--royal),#4f86ff);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:600 16px Barlow;cursor:pointer;box-shadow:0 6px 14px rgba(33,89,240,.28)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#e3ecff;color:var(--royal);box-shadow:none}
header .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.x{background:none;border:0;color:#9db0d8;cursor:pointer;font-size:18px;border-radius:8px;padding:4px 8px}
.x:hover{color:var(--red);background:#fff0f0}
.dia{background:linear-gradient(135deg,var(--sky),var(--royal));color:#fff;border-radius:999px;padding:4px 14px;font:600 14px Barlow;white-space:nowrap}
.treino-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.treino-h h3{font-size:30px;color:var(--navy)}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;margin:6px 0 14px;background:#000;box-shadow:0 8px 20px rgba(6,23,68,.25)}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px;border:1px solid var(--line)}
th,td{text-align:left;padding:11px 12px}
th{background:var(--ice);color:var(--mut);font-weight:600;font-size:14px}
tr:nth-child(even) td{background:#f7faff}
td{border-top:1px solid var(--line)}
td:nth-child(4){color:var(--royal);font-weight:600}
.sub{color:var(--mut);margin:0 0 14px}
.empty{color:var(--mut);padding:24px;text-align:center;background:var(--ice);border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .h{text-align:center;color:var(--mut);font-size:13px;font-weight:600}
.cal button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--ice);border-radius:14px;font:600 16px Barlow;cursor:pointer;color:var(--ink);transition:transform .15s}
.cal button:hover{transform:scale(1.06)}
.cal button.sim{background:linear-gradient(135deg,var(--royal),var(--sky));color:#fff;border-color:transparent;box-shadow:0 6px 12px rgba(33,89,240,.3)}
.cal button.nao{background:#fff;color:var(--red);border-color:var(--red)}
.cal .vazio{visibility:hidden}
.leg{display:flex;gap:18px;color:var(--mut);font-size:14px;margin-top:14px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px}
#login{max-width:360px;margin:12vh auto;padding:28px}
#login h2{font-size:40px}
#login input{width:100%;margin-bottom:10px}
.msg{color:var(--red);font-size:14px;min-height:20px}
.hide{display:none}
.card.hoje{border:2px solid var(--royal);box-shadow:0 12px 30px rgba(33,89,240,.25)}
.hojeb{background:#fff3c4;color:#8a5a00;border-radius:999px;padding:3px 12px;font:600 13px Barlow}
#tm{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#tm .fab{width:58px;height:58px;border-radius:50%;border:0;font-size:26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--royal),var(--sky));box-shadow:0 8px 20px rgba(33,89,240,.45)}
#tm .pn{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line);text-align:center}
#tm .t{font:700 56px/1 'Barlow Condensed',sans-serif;color:var(--navy)}
#tm .t.fim{color:var(--red)}
.fogo{display:flex;align-items:center;gap:18px;color:#fff;background:radial-gradient(300px 140px at 0% 0%,rgba(56,189,248,.5),transparent 70%),linear-gradient(135deg,var(--navy),var(--royal));border:0}
.fogo .n{font:700 76px/1 'Barlow Condensed',sans-serif}
.fogo .e{font-size:54px}
.fogo small{display:block;color:#b9ccff;font-size:15px}
.stats{display:flex;gap:22px;margin-left:auto;text-align:right}
.stats b{font:700 30px 'Barlow Condensed',sans-serif;display:block}
.mes{font:700 22px 'Barlow Condensed',sans-serif;color:var(--royal);margin:18px 0 8px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sess .d{font-weight:600;min-width:84px;color:var(--royal)}
.sess details{flex:1}.sess summary{cursor:pointer;font-weight:600}
.sess ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}
@media(max-width:520px){header h1{font-size:38px}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <header>
    <div class="top"><div><h1>Meus Treinos</h1><p>Treine, registre e veja sua evolução.</p></div><button class="btn ghost" onclick="backup()">⬇ Backup</button></div>
    <nav id="nav">
      <button data-t="treinos" class="on">Treinos</button>
      <button data-t="historico">Histórico 🔥</button>
      <button data-t="peso">Peso</button>
      <button data-t="corrida">Corrida</button>
    </nav>
  </header>
  <main>
    <section id="treinos"></section>
    <section id="historico" class="hide"></section>
    <section id="peso" class="hide"></section>
    <section id="corrida" class="hide"></section>
  </main>
</div>

<div id="tm"><div class="pn hide" id="tp"><div class="t" id="tt">0:00</div><p class="sub" style="margin:4px 0 10px">Descanso</p>
<div class="row" style="justify-content:center"><button class="btn ghost" onclick="timer(45)">45s</button><button class="btn ghost" onclick="timer(60)">60s</button><button class="btn ghost" onclick="timer(90)">90s</button><button class="btn ghost" onclick="timer(120)">2min</button></div></div>
<button class="fab" onclick="$('#tp').classList.toggle('hide')" aria-label="Timer de descanso">⏱</button></div>
<script>
/* ====== CONFIGURE AQUI (Supabase → Project Settings → API) ====== */
const SUPABASE_URL = "https://fewbgijdymcoeufeazfm.supabase.co";
const SUPABASE_KEY = "sb_publishable_J38Jpnhnb90NJrgHEknfMw_Bhs95MYX";
/* ================================================================ */

const configurado = /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
let sb = null;
try { if (configurado) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIAS = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const hoje = new Date();
const iso = d => new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
let pesoAno = hoje.getFullYear(), pesoMes = hoje.getMonth()+1;
let corAno = hoje.getFullYear(), corMes = hoje.getMonth();

/* ---------- Timer de descanso ---------- */
let tInt=null, evoSel="";
function bip(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(); o.connect(a.destination); o.frequency.value=880; o.start(); o.stop(a.currentTime+.6);}catch(e){} try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){} }
function timer(seg){
  clearInterval(tInt); let r=seg; const el=$("#tt");
  const draw=()=>{ el.textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0"); el.classList.toggle("fim",r===0); };
  draw();
  tInt=setInterval(()=>{ r--; draw(); if(r<=0){ clearInterval(tInt); bip(); } },1000);
}

/* ---------- Backup ---------- */
async function backup(){
  const o={};
  for(const n of ["treinos","exercicios","sessoes","pesos","corridas"]){ const {data}=await sb.from(n).select("*"); o[n]=data||[]; }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));
  a.download="backup-treinos-"+iso(hoje)+".json"; a.click();
}

/* ---------- Início ---------- */
function iniciar(){
  if(!sb){
    $("#treinos").innerHTML = `<div class="card"><h2>Falta configurar</h2><p class="sub" style="margin-top:8px">${configurado
      ? "Não foi possível carregar o Supabase. Verifique a internet e abra este arquivo pelo navegador."
      : "Abra este arquivo no Bloco de Notas e cole a URL e a anon key do Supabase no topo do script."}</p></div>`;
    return;
  }
  renderTreinos(); renderHistorico(); renderPeso(); renderCorrida();
}
$("#nav").addEventListener("click", e => {
  const t = e.target.dataset.t; if(!t) return;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t===t));
  ["treinos","historico","peso","corrida"].forEach(id => $("#"+id).classList.toggle("hide", id!==t));
});

/* ---------- Treinos ---------- */
function ytId(u){ const m = String(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }

async function renderTreinos(){
  const {data:treinos} = await sb.from("treinos").select("*, exercicios(*)").order("created_at");
  const ordem = t => DIAS.indexOf(t.dia);
  const hd = DIAS[(hoje.getDay()+6)%7];
  (treinos||[]).sort((a,b)=>((b.dia===hd)-(a.dia===hd))||ordem(a)-ordem(b));
  $("#treinos").innerHTML = `
  <div class="card">
    <h2>Novo treino</h2>
    <div class="row" style="margin-top:10px">
      <input id="tn" placeholder="Nome do treino (ex: Peito e tríceps)" style="flex:2 1 200px">
      <select id="td">${DIAS.map(d=>`<option>${d}</option>`).join("")}</select>
      <input id="tv" placeholder="Link do vídeo no YouTube" style="flex:2 1 200px">
      <button class="btn" onclick="addTreino()">Salvar treino</button>
    </div>
  </div>` + ((treinos||[]).length ? treinos.map(t => {
    const id = ytId(t.video_url);
    const ex = (t.exercicios||[]).sort((a,b)=>a.ordem-b.ordem);
    return `<div class="card${t.dia===hd?" hoje":""}">
      <div class="treino-h"><div class="row"><span class="dia">${esc(t.dia)}</span>${t.dia===hd?`<span class="hojeb">Treino de hoje</span>`:""}<h3>${esc(t.nome)}</h3></div>
      <button class="x" title="Excluir treino" onclick="delTreino('${t.id}')">🗑</button></div>
      <div class="row" style="margin-bottom:10px"><input type="date" id="sd-${t.id}" value="${iso(hoje)}" aria-label="Data do treino"><input id="so-${t.id}" placeholder="Observação (opcional)" style="flex:1 1 160px"><button class="btn" onclick="treinei('${t.id}')">🔥 Treinei</button></div>
      ${id ? `<iframe class="video" src="https://www.youtube.com/embed/${id}?rel=0&playsinline=1" title="Vídeo do treino" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>` : ""}
      ${ex.length ? `<table><tr><th>Exercício</th><th>Séries</th><th>Repetições</th><th>Carga (kg)</th><th></th></tr>
      ${ex.map(e=>`<tr><td>${esc(e.nome)}</td><td>${esc(e.series)}</td><td>${esc(e.repeticoes)}</td><td>${esc(e.carga)}</td>
      <td style="white-space:nowrap"><button class="x" title="Editar exercício" onclick="editEx('${e.id}')">✎</button><button class="x" title="Excluir exercício" onclick="delEx('${e.id}')">✕</button></td></tr>`).join("")}</table>` : `<p class="empty">Nenhum exercício ainda. Adicione abaixo.</p>`}
      <div class="row" style="margin-top:12px">
        <input id="en-${t.id}" placeholder="Exercício" style="flex:2 1 150px">
        <input id="es-${t.id}" type="number" placeholder="Séries" style="width:90px">
        <input id="er-${t.id}" placeholder="Reps (ex: 12)" style="width:110px">
        <input id="ec-${t.id}" placeholder="Carga kg" style="width:100px">
        <button class="btn ghost" onclick="addEx('${t.id}')">Adicionar</button>
      </div></div>`;
  }).join("") : `<p class="empty">Você ainda não cadastrou treinos.</p>`);
}
async function addTreino(){
  const nome = $("#tn").value.trim(); if(!nome) return alert("Digite o nome do treino.");
  await sb.from("treinos").insert({nome, dia:$("#td").value, video_url:$("#tv").value.trim()});
  renderTreinos();
}
async function delTreino(id){ if(confirm("Excluir este treino e seus exercícios?")){ await sb.from("treinos").delete().eq("id",id); renderTreinos(); } }
async function addEx(tid){
  const nome = $("#en-"+tid).value.trim(); if(!nome) return alert("Digite o nome do exercício.");
  await sb.from("exercicios").insert({treino_id:tid, nome, series:$("#es-"+tid).value||null, repeticoes:$("#er-"+tid).value, carga:$("#ec-"+tid).value, ordem:Date.now()%2000000000});
  renderTreinos();
}
async function editEx(id){
  const {data:e} = await sb.from("exercicios").select("*").eq("id",id).single();
  const nome = prompt("Exercício:", e.nome); if(nome===null) return;
  const series = prompt("Séries:", e.series ?? ""); if(series===null) return;
  const reps = prompt("Repetições:", e.repeticoes ?? ""); if(reps===null) return;
  const carga = prompt("Carga (kg):", e.carga ?? ""); if(carga===null) return;
  await sb.from("exercicios").update({nome:nome.trim()||e.nome, series:series||null, repeticoes:reps, carga}).eq("id",id);
  renderTreinos(); renderHistorico();
}
async function delEx(id){ await sb.from("exercicios").delete().eq("id",id); renderTreinos(); }

/* ---------- Histórico ---------- */
async function treinei(tid){
  const data = $("#sd-"+tid).value || iso(hoje);
  const {data:t} = await sb.from("treinos").select("nome, exercicios(nome,series,repeticoes,carga,ordem)").eq("id",tid).single();
  const obs = ($("#so-"+tid).value||"").trim();
  const detalhe = (t.exercicios||[]).sort((a,b)=>a.ordem-b.ordem).map(({ordem,...e})=>e);
  const {error} = await sb.from("sessoes").insert({treino_id:tid, nome:t.nome, data, obs:obs||null, detalhe});
  if(error) alert(error.code==="23505" ? "Este treino já está marcado nesse dia." : "Erro: "+error.message);
  renderHistorico();
  if(!error) document.querySelector('[data-t="historico"]').click();
}
function sequencia(datas){
  const set = new Set(datas), dias = [...set].sort();
  let melhor=0, run=0, prev=null;
  for(const k of dias){ const d=parse(k); run = prev && (d-prev)===86400000 ? run+1 : 1; melhor=Math.max(melhor,run); prev=d; }
  let atual=0, c=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  if(!set.has(iso(c))) c.setDate(c.getDate()-1);
  while(set.has(iso(c))){ atual++; c.setDate(c.getDate()-1); }
  return {atual, melhor};
}
async function renderHistorico(){
  const {data,error} = await sb.from("sessoes").select("*, treinos(nome, exercicios(nome,series,repeticoes,carga))").order("data",{ascending:false});
  if(error){ $("#historico").innerHTML=`<div class="card"><h2>Histórico</h2><p class="sub">Crie a tabela "sessoes" no Supabase (SQL enviado no chat). Erro: ${esc(error.message)}</p></div>`; return; }
  const l = data||[], {atual,melhor} = sequencia(l.map(x=>x.data));
  const mesAtual = iso(hoje).slice(0,7), noMes = new Set(l.filter(x=>x.data.startsWith(mesAtual)).map(x=>x.data)).size;
  const grupos = {};
  l.forEach(x=>{ (grupos[x.data.slice(0,7)] ||= []).push(x); });
  const nomes=[...new Set(l.flatMap(x=>(x.detalhe||[]).map(e=>e.nome)))].sort();
  if(!nomes.includes(evoSel)) evoSel=nomes[0]||"";
  const serie=l.slice().reverse().map(x=>{const e=(x.detalhe||[]).find(e=>e.nome===evoSel);const c=e?parseFloat(String(e.carga).replace(",",".")):NaN;return isNaN(c)?null:c;}).filter(c=>c!==null);
  const evo = nomes.length ? `<div class="card"><div class="treino-h"><h2>Evolução da carga</h2><select onchange="evoSel=this.value;renderHistorico()">${nomes.map(n=>`<option ${n===evoSel?"selected":""}>${esc(n)}</option>`).join("")}</select></div>${serie.length>1?linhaSvg(serie):`<p class="empty">Marque mais treinos com este exercício para ver a evolução.</p>`}${serie.length>1?`<p class="sub">De ${serie[0]} kg para <b>${serie[serie.length-1]} kg</b></p>`:""}</div>` : "";
  $("#historico").innerHTML = `<div class="card fogo"><span class="e">🔥</span><div><span class="n">${atual}</span><small>${atual===1?"dia seguido":"dias seguidos"}</small></div>
    <div class="stats"><div><b>${melhor}</b><small>recorde</small></div><div><b>${noMes}</b><small>no mês</small></div><div><b>${l.length}</b><small>total</small></div></div></div>
  ${evo}<div class="card"><h2>Histórico de treinos</h2>${l.length ? Object.keys(grupos).map(m=>`<div class="mes">${MESES[+m.slice(5)-1]} ${m.slice(0,4)}</div>`+grupos[m].map(x=>{
    const ex=x.detalhe||x.treinos?.exercicios||[], dt=parse(x.data);
    return `<div class="sess"><span class="d">${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")} · ${DIAS[(dt.getDay()+6)%7].slice(0,3)}</span>
    <details><summary>${esc(x.treinos?.nome||x.nome)}</summary>${ex.length?`<ul>${ex.map(e=>`<li>${esc(e.nome)} — ${esc(e.series||"")}x${esc(e.repeticoes||"")} ${e.carga?`· ${esc(e.carga)} kg`:""}</li>`).join("")}</ul>`:""}${x.obs?`<p class="sub" style="margin:6px 0 0">📝 ${esc(x.obs)}</p>`:""}</details>
    <button class="x" title="Remover" onclick="delSessao('${x.id}')">✕</button></div>`;}).join("")).join("") : `<p class="empty">Nenhum treino marcado ainda. Abra um treino e toque em "Treinei".</p>`}</div>`;
}
async function delSessao(id){ await sb.from("sessoes").delete().eq("id",id); renderHistorico(); }

/* ---------- Peso ---------- */
async function renderPeso(){
  const {data} = await sb.from("pesos").select("*").order("data");
  const todos = data||[];
  const anos = [...new Set(todos.map(p=>+p.data.slice(0,4)).concat(hoje.getFullYear()))].sort();
  const lista = todos.filter(p => +p.data.slice(0,4)===pesoAno && (pesoMes===0 || +p.data.slice(5,7)===pesoMes));
  const pts = lista.map(p=>+p.peso);
  const variacao = pts.length>1 ? (pts[pts.length-1]-pts[0]).toFixed(1) : null;
  $("#peso").innerHTML = `
  <div class="card"><h2>Registrar peso</h2>
    <div class="row" style="margin-top:10px"><input id="pd" type="date" value="${iso(hoje)}"><input id="pp" type="number" step="0.1" placeholder="Peso (kg)" style="width:130px">
    <button class="btn" onclick="addPeso()">Salvar peso</button></div></div>
  <div class="card"><div class="treino-h"><h2>Histórico</h2>
    <div class="row"><select onchange="pesoAno=+this.value;renderPeso()">${anos.map(a=>`<option ${a===pesoAno?"selected":""}>${a}</option>`).join("")}</select>
    <select onchange="pesoMes=+this.value;renderPeso()"><option value="0" ${pesoMes===0?"selected":""}>Ano todo</option>${MESES.map((m,i)=>`<option value="${i+1}" ${pesoMes===i+1?"selected":""}>${m}</option>`).join("")}</select></div></div>
    ${variacao!==null?`<p class="sub">Variação no período: <b>${variacao>0?"+":""}${variacao} kg</b></p>`:""}
    ${metaPeso(todos)}
    ${grafico(lista)}
    ${lista.length?`<table><tr><th>Data</th><th>Peso</th><th></th></tr>${[...lista].reverse().map(p=>`<tr><td>${p.data.split("-").reverse().join("/")}</td><td>${p.peso} kg</td><td><button class="x" onclick="delPeso('${p.id}')">✕</button></td></tr>`).join("")}</table>`:`<p class="empty">Sem registros neste período.</p>`}
  </div>`;
}
function linhaSvg(v){
  const mn=Math.min(...v), mx=Math.max(...v), r=(mx-mn)||1, W=600, H=160;
  const p=v.map((y,i)=>[20+i*(W-40)/(v.length-1), H-26-(y-mn)/r*(H-52)]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-bottom:8px" role="img" aria-label="Evolução da carga"><polyline fill="none" stroke="#2159f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${p.map(a=>a.join(",")).join(" ")}"/>${p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="4.5" fill="#2159f0"><title>${v[i]} kg</title></circle>`).join("")}<text x="20" y="14" font-size="12" fill="#6479a8">${mx} kg</text><text x="20" y="${H-4}" font-size="12" fill="#6479a8">${mn} kg</text></svg>`;
}
function metaPeso(todos){
  let meta=""; try{ meta = localStorage.getItem("metaPeso")||""; }catch(e){}
  const atual = todos.length ? +todos[todos.length-1].peso : null, m = parseFloat(meta);
  const dif = (atual!==null && m) ? (atual-m).toFixed(1) : null;
  return `<div class="row" style="margin-bottom:12px"><span class="sub" style="margin:0">Meta:</span>
    <input type="number" step="0.1" value="${esc(meta)}" placeholder="kg" style="width:100px" onchange="try{localStorage.setItem('metaPeso',this.value)}catch(e){};renderPeso()">
    ${dif!==null ? `<b style="color:var(--royal)">${atual} kg agora · ${Math.abs(dif)} kg ${dif>0?"para perder":dif<0?"para ganhar":"— meta batida! 🎯"}</b>` : ""}</div>`;
}
function grafico(l){
  if(l.length<2) return "";
  const v=l.map(p=>+p.peso), mn=Math.min(...v)-1, mx=Math.max(...v)+1, W=600, H=160;
  const xy=(p,i)=>[20+i*(W-40)/(l.length-1), H-20-(p-mn)/(mx-mn)*(H-40)];
  const pts=v.map(xy);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-bottom:12px" role="img" aria-label="Gráfico de peso">
  <polyline fill="none" stroke="#2159f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2159f0"><title>${v[i]} kg</title></circle>`).join("")}
  <text x="20" y="14" font-size="12" fill="#6b7a99">${(mx-1).toFixed(1)} kg</text><text x="20" y="${H-4}" font-size="12" fill="#6b7a99">${(mn+1).toFixed(1)} kg</text></svg>`;
}
async function addPeso(){
  const peso=$("#pp").value; if(!peso) return alert("Digite o peso.");
  await sb.from("pesos").insert({data:$("#pd").value, peso}); renderPeso();
}
async function delPeso(id){ await sb.from("pesos").delete().eq("id",id); renderPeso(); }

/* ---------- Corrida ---------- */
async function renderCorrida(){
  const ini = `${corAno}-${String(corMes+1).padStart(2,"0")}-01`;
  const fim = iso(new Date(corAno, corMes+1, 0));
  const {data} = await sb.from("corridas").select("*").gte("data",ini).lte("data",fim);
  const mapa = Object.fromEntries((data||[]).map(c=>[c.data,c.correu]));
  const dias = new Date(corAno, corMes+1, 0).getDate(), primeiro = new Date(corAno, corMes, 1).getDay();
  let cel = "";
  for(let i=0;i<primeiro;i++) cel += `<button class="vazio" tabindex="-1"></button>`;
  for(let d=1; d<=dias; d++){
    const k = `${corAno}-${String(corMes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const st = k in mapa ? (mapa[k] ? "sim" : "nao") : "";
    cel += `<button class="${st}" onclick="ciclo('${k}')" aria-label="Dia ${d}">${d}</button>`;
  }
  const corri = (data||[]).filter(c=>c.correu).length;
  const cs=(data||[]).filter(c=>c.correu&&(c.km||c.minutos)).sort((a,b)=>a.data<b.data?1:-1);
  const tkm=cs.reduce((t,c)=>t+(+c.km||0),0);
  const pace=c=>{ if(!c.km||!c.minutos) return "–"; const p=c.minutos/c.km; return Math.floor(p)+":"+String(Math.round((p%1)*60)).padStart(2,"0")+"/km"; };
  const kmLista = cs.length ? `<p class="sub" style="margin-top:14px">Total no mês: <b>${tkm.toFixed(1)} km</b></p><table><tr><th>Dia</th><th>Km</th><th>Tempo</th><th>Ritmo</th></tr>${cs.map(c=>`<tr><td>${c.data.slice(8)}/${c.data.slice(5,7)}</td><td>${c.km??"–"}</td><td>${c.minutos?c.minutos+" min":"–"}</td><td>${pace(c)}</td></tr>`).join("")}</table>` : "";
  $("#corrida").innerHTML = `<div class="card">
    <div class="treino-h"><button class="btn ghost" onclick="mudaMes(-1)">‹</button><h2>${MESES[corMes]} ${corAno}</h2><button class="btn ghost" onclick="mudaMes(1)">›</button></div>
    <p class="sub">Toque no dia: 1x = correu, 2x = não correu, 3x = limpar. Neste mês: <b>${corri}</b> ${corri===1?"dia":"dias"} de corrida.</p>
    <div class="cal">${["D","S","T","Q","Q","S","S"].map(x=>`<div class="h">${x}</div>`).join("")}${cel}</div>
    <div class="leg"><span><i style="background:var(--blue)"></i>Correu</span><span><i style="border:2px solid var(--red)"></i>Não correu</span></div>
    <div class="row" style="margin-top:16px"><input type="date" id="cd" value="${iso(hoje)}"><input id="ck" type="number" step="0.01" placeholder="Km" style="width:90px"><input id="cm" type="number" placeholder="Minutos" style="width:100px"><button class="btn" onclick="salvaCorrida()">Salvar corrida</button></div>
    ${kmLista}</div>`;
}
function mudaMes(n){ corMes+=n; if(corMes<0){corMes=11;corAno--} if(corMes>11){corMes=0;corAno++} renderCorrida(); }
async function salvaCorrida(){
  const d=$("#cd").value; if(!d) return alert("Escolha o dia.");
  const {error}=await sb.from("corridas").upsert({data:d, correu:true, km:+$("#ck").value||null, minutos:+$("#cm").value||null},{onConflict:"data"});
  if(error) return alert("Erro: "+error.message);
  corAno=+d.slice(0,4); corMes=+d.slice(5,7)-1; renderCorrida();
}
async function ciclo(k){
  const {data} = await sb.from("corridas").select("*").eq("data",k).maybeSingle();
  if(!data) await sb.from("corridas").insert({data:k, correu:true});
  else if(data.correu) await sb.from("corridas").update({correu:false}).eq("id",data.id);
  else await sb.from("corridas").delete().eq("id",data.id);
  renderCorrida();
}

iniciar();
</script>
</body>
</html>
